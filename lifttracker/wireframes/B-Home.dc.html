<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Focus · Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
body{margin:0;background:#14120F;color:#F3EFE6;font-family:"Barlow",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#6FD3B0}a:hover{color:#8FE3C6}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.big{font-family:"Barlow Condensed","Barlow",sans-serif;font-variant-numeric:tabular-nums}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#9A938A}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#14120F;display:flex;flex-direction:column;overflow:hidden;padding:24px 20px 24px">

  <header style="display:flex;align-items:center;justify-content:space-between">
    <span class="big" style="font-size:18px;font-weight:600;letter-spacing:.04em">LIFTTRACKER</span>
    <button aria-label="Settings" style="width:40px;height:40px;border-radius:20px;border:1px solid #3A352E;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A938A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>

  <section style="margin-top:56px;display:flex;flex-direction:column;gap:8px">
    <span class="lbl">Up next · Day 1 of 4</span>
    <h1 class="big" style="margin:0;font-size:96px;line-height:.85;font-weight:700;letter-spacing:-.03em">Push A</h1>
    <div style="font-size:15px;color:#9A938A;margin-top:6px">Chest, shoulders, triceps, core</div>
  </section>

  <ol style="list-style:none;margin:30px 0 0;padding:0;display:flex;flex-direction:column">
    <li style="display:flex;align-items:center;gap:14px;min-height:50px;border-top:1px solid #2A2621"><span class="big" style="width:28px;font-size:22px;color:#6FD3B0;font-weight:600">1</span><span style="flex:1;font-size:16px">Barbell bench press</span><span class="big" style="font-size:15px;color:#9A938A">4 × 5–8</span></li>
    <li style="display:flex;align-items:center;gap:14px;min-height:50px;border-top:1px solid #2A2621"><span class="big" style="width:28px;font-size:22px;color:#6FD3B0;font-weight:600">2</span><span style="flex:1;font-size:16px">Machine chest press</span><span class="big" style="font-size:15px;color:#9A938A">3 × 8–10</span></li>
    <li style="display:flex;align-items:center;gap:14px;min-height:50px;border-top:1px solid #2A2621"><span class="big" style="width:28px;font-size:22px;color:#6FD3B0;font-weight:600">3</span><span style="flex:1;font-size:16px">Dumbbell shoulder press</span><span class="big" style="font-size:15px;color:#9A938A">3 × 8–10</span></li>
    <li style="display:flex;align-items:center;gap:14px;min-height:50px;border-top:1px solid #2A2621"><span class="big" style="width:28px;font-size:22px;color:#6FD3B0;font-weight:600">4</span><span style="flex:1;font-size:16px">Dips</span><span class="big" style="font-size:15px;color:#9A938A">3 × 8–12</span></li>
    <li style="display:flex;align-items:center;gap:14px;min-height:50px;border-top:1px solid #2A2621;border-bottom:1px solid #2A2621"><span class="big" style="width:28px;font-size:22px;color:#6FD3B0;font-weight:600">5</span><span style="flex:1;font-size:16px">Weighted cable crunch</span><span class="big" style="font-size:15px;color:#9A938A">3 × 10–12</span></li>
  </ol>

  <section style="margin-top:28px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;justify-content:space-between" class="lbl"><span>Cycle</span><span>Last: Pull B · Oct 13</span></div>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px">
      <div style="height:8px;border-radius:4px;background:#6FD3B0"></div>
      <div style="height:8px;border-radius:4px;background:#3A352E"></div>
      <div style="height:8px;border-radius:4px;background:#3A352E"></div>
      <div style="height:8px;border-radius:4px;background:#3A352E"></div>
    </div>
    <div class="big" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-size:14px;color:#9A938A"><span style="color:#F3EFE6">Push A</span><span>Pull A</span><span>Push B</span><span>Pull B</span></div>
  </section>

  <div style="flex:1"></div>

  <button style="height:68px;border-radius:16px;background:#6FD3B0;color:#14120F;display:flex;align-items:center;justify-content:center"><span class="big" style="font-size:26px;font-weight:600;letter-spacing:.02em">Start Push A</span></button>
  <button style="height:44px;margin-top:4px;color:#9A938A;font-size:14px">Start a different day</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
