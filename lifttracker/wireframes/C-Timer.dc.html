<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rack · Rest timer running</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;background:#EEF0F2;color:#16181C;font-family:"Public Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#2C4FD6}a:hover{color:#1F3BAA}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.d{font-family:"Bricolage Grotesque","Public Sans",sans-serif;font-variant-numeric:tabular-nums}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6B7280}
.chip{height:40px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;font-size:14px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#EEF0F2;display:flex;flex-direction:column;overflow:hidden">

  <header role="timer" aria-label="Rest, 47 seconds of 1 minute 30" style="padding:24px 20px 0;background:#FFFFFF;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <h1 class="d" style="margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em">Push A</h1>
      <div style="display:flex;align-items:baseline;gap:6px"><span class="lbl">Rest</span><span class="d" style="font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1">0:47</span><span class="d" style="font-size:13px;color:#6B7280">/ 1:30</span></div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;padding-bottom:12px">
      <button class="d" style="height:40px;padding:0 14px;border-radius:20px;border:1px solid #DDE1E6;font-size:14px;font-weight:600">−15 s</button>
      <button class="d" style="height:40px;padding:0 14px;border-radius:20px;border:1px solid #DDE1E6;font-size:14px;font-weight:600">+15 s</button>
      <button style="height:40px;padding:0 14px;border-radius:20px;background:#EEF0F2;font-size:14px;color:#374151">Skip</button>
    </div>
    <div aria-hidden="true" style="height:6px;background:#DDE1E6;display:flex">
      <span style="width:52%;height:6px;background:#2C4FD6"></span>
    </div>
  </header>

  <main style="flex:1;min-height:0;overflow:hidden;padding:16px 20px;display:flex;flex-direction:column;gap:12px">
    <section style="background:#FFFFFF;border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(22,24,28,.06),0 6px 16px rgba(22,24,28,.05);display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px">
        <h2 class="d" style="margin:0;font-size:19px;font-weight:600">Barbell bench press</h2>
        <span class="d" style="font-size:13px;color:#6B7280">4 × 5–8 · kg</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <span class="chip d" style="background:#2C4FD6;color:#FFFFFF;font-weight:600">62.5 × 8<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-label="done"><path d="M5 12l5 5L20 7"/></svg></span>
        <span class="chip d" style="background:#2C4FD6;color:#FFFFFF;font-weight:600">62.5 × 7<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-label="done"><path d="M5 12l5 5L20 7"/></svg></span>
        <span class="chip d" style="background:#2C4FD6;color:#FFFFFF;font-weight:600">62.5 × 6<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-label="done"><path d="M5 12l5 5L20 7"/></svg></span>
      </div>
      <div style="border-top:1px solid #EEF0F2;padding-top:12px;display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="lbl">Set 4 · after rest</span><span class="d" style="font-size:13px;color:#2C4FD6;font-weight:600">last 57.5 kg × 8</span></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div style="display:flex;align-items:center;justify-content:space-between;height:56px;border-radius:12px;background:#EEF0F2;padding:0 4px">
            <button aria-label="Minus 2.5 kg" style="width:48px;height:48px;border-radius:10px;background:#FFFFFF;font-size:22px;box-shadow:0 1px 2px rgba(22,24,28,.08)">−</button>
            <span style="display:flex;flex-direction:column;align-items:center"><span class="d" style="font-size:24px;font-weight:700;line-height:1">57.5</span><span class="lbl" style="font-size:10px">kg</span></span>
            <button aria-label="Plus 2.5 kg" style="width:48px;height:48px;border-radius:10px;background:#FFFFFF;font-size:22px;box-shadow:0 1px 2px rgba(22,24,28,.08)">+</button>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;height:56px;border-radius:12px;background:#EEF0F2;padding:0 4px">
            <button aria-label="One rep fewer" style="width:48px;height:48px;border-radius:10px;background:#FFFFFF;font-size:22px;box-shadow:0 1px 2px rgba(22,24,28,.08)">−</button>
            <span style="display:flex;flex-direction:column;align-items:center"><span class="d" style="font-size:24px;font-weight:700;line-height:1">8</span><span class="lbl" style="font-size:10px">reps</span></span>
            <button aria-label="One rep more" style="width:48px;height:48px;border-radius:10px;background:#FFFFFF;font-size:22px;box-shadow:0 1px 2px rgba(22,24,28,.08)">+</button>
          </div>
        </div>
        <button style="height:56px;border-radius:12px;background:#16181C;color:#FFFFFF;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>Done</button>
      </div>
      <div style="display:flex;align-items:center;gap:10px;padding-top:4px">
        <span class="lbl">Per side</span>
        <span aria-label="15 kilogram plate" style="width:20px;height:20px;border-radius:50%;background:#2C4FD6;border:3px solid #DCE2F8"></span>
        <span aria-label="2.5 kilogram plate" style="width:14px;height:14px;border-radius:50%;background:#9AA3B2;border:3px solid #E5E8EC"></span>
        <span aria-label="1.25 kilogram plate" style="width:12px;height:12px;border-radius:50%;background:#9AA3B2;border:3px solid #E5E8EC"></span>
        <span class="d" style="font-size:13px;color:#374151">15 · 2.5 · 1.25 kg</span>
      </div>
    </section>

    <section style="background:#FFFFFF;border-radius:16px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 1px 2px rgba(22,24,28,.06)">
      <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
        <h2 class="d" style="margin:0;font-size:17px;font-weight:600">Machine chest press</h2>
        <div style="display:flex;gap:6px"><span class="chip d" style="height:28px;border:1.5px dashed #C3C9D1;color:#6B7280;font-size:12px;padding:0 10px">50 × 10</span><span class="chip d" style="height:28px;border:1.5px dashed #C3C9D1;color:#6B7280;font-size:12px;padding:0 10px">50 × 10</span><span class="chip d" style="height:28px;border:1.5px dashed #C3C9D1;color:#6B7280;font-size:12px;padding:0 10px">50 × 9</span></div>
      </div>
      <span class="d" style="font-size:13px;color:#6B7280;flex:none">3 × 8–10 · kg</span>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
