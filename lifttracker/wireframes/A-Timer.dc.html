<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ledger · Rest timer running</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
body{margin:0;background:#15181D;color:#ECEAE4;font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#E8B84A}a:hover{color:#F2CB6C}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#98A0AE}
.tbl{display:grid;grid-template-columns:28px 1fr 96px 64px 56px;align-items:center;column-gap:8px}
.ghost{color:#6A7280}
.row{min-height:48px;border-top:1px solid #262C35}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#15181D;display:flex;flex-direction:column;overflow:hidden">

  <header style="padding:28px 20px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px">
    <div style="display:flex;flex-direction:column;gap:4px">
      <h1 style="margin:0;font-size:26px;line-height:1.1;font-weight:600">Push A</h1>
      <div class="lbl">Day 1 of 4 · 2 of 5 done</div>
    </div>
    <button style="height:40px;padding:0 14px;border:1px solid #2A3038;border-radius:10px;color:#98A0AE;font-size:14px">Finish</button>
  </header>

  <main style="flex:1;min-height:0;overflow:hidden;padding:0 20px;display:flex;flex-direction:column;gap:18px">
    <section style="background:#1D2128;border-radius:14px;padding:14px 14px 6px;display:flex;flex-direction:column">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-bottom:10px">
        <h2 style="margin:0;font-size:17px;font-weight:600">Barbell bench press</h2>
        <div class="num" style="font-size:12px;color:#98A0AE">4 × 5–8 · kg · 1:30</div>
      </div>
      <div class="tbl lbl" style="padding-bottom:6px"><span>Set</span><span>Last</span><span style="text-align:center">kg</span><span style="text-align:center">Reps</span><span></span></div>
      <div class="tbl row">
        <span class="num" style="color:#98A0AE">1</span>
        <span class="num" style="font-size:14px;color:#98A0AE">60 × 8</span>
        <span class="num" style="font-size:18px;font-weight:600;text-align:center">62.5</span>
        <span class="num" style="font-size:18px;font-weight:600;text-align:center">8</span>
        <span style="display:flex;justify-content:flex-end"><span style="width:36px;height:36px;border-radius:9px;background:#E8B84A;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15181D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span></span>
      </div>
      <div class="tbl row">
        <span class="num" style="color:#98A0AE">2</span>
        <span class="num" style="font-size:14px;color:#98A0AE">60 × 7</span>
        <span class="num" style="font-size:18px;font-weight:600;text-align:center">62.5</span>
        <span class="num" style="font-size:18px;font-weight:600;text-align:center">7</span>
        <span style="display:flex;justify-content:flex-end"><span style="width:36px;height:36px;border-radius:9px;background:#E8B84A;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15181D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span></span>
      </div>
      <div class="tbl row" style="min-height:64px;background:#232832;margin:0 -14px;padding:0 14px;border-top:1px solid #2A3038;border-bottom:1px solid #2A3038">
        <span class="num">3</span>
        <span class="num" style="font-size:14px;color:#98A0AE">60 × 6</span>
        <div style="display:flex;align-items:center;gap:2px">
          <button aria-label="Minus 2.5 kg" style="width:30px;height:44px;color:#98A0AE;font-size:20px">−</button>
          <span class="num" style="flex:1;text-align:center;font-size:20px;font-weight:600;border-bottom:2px solid #E8B84A;padding-bottom:2px">62.5</span>
          <button aria-label="Plus 2.5 kg" style="width:30px;height:44px;color:#98A0AE;font-size:20px">+</button>
        </div>
        <span class="num" style="font-size:20px;font-weight:600;text-align:center">6</span>
        <span style="display:flex;justify-content:flex-end"><button aria-label="Mark set 3 done" style="width:48px;height:48px;border-radius:12px;background:#E8B84A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#15181D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></button></span>
      </div>
      <div class="tbl row">
        <span class="num ghost">4</span>
        <span class="num ghost" style="font-size:14px">57.5 × 8</span>
        <span class="num ghost" style="font-size:18px;text-align:center">57.5</span>
        <span class="num ghost" style="font-size:18px;text-align:center">8</span>
        <span style="display:flex;justify-content:flex-end"><span style="width:36px;height:36px;border-radius:9px;border:1.5px solid #2F3640"></span></span>
      </div>
    </section>

    <button style="display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:0 14px;border-radius:12px;background:#1D2128;text-align:left">
      <span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:500">Machine chest press</span><span class="num" style="font-size:12px;color:#98A0AE">3 × 8–10 · kg · last 50 × 10</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6A7280" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </main>

  <footer style="padding:12px 20px 24px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;justify-content:center;gap:10px">
      <button style="height:44px;padding:0 18px;border-radius:22px;border:1px solid #2A3038;color:#ECEAE4;font-size:14px" class="num">−15 s</button>
      <button style="height:44px;padding:0 18px;border-radius:22px;border:1px solid #2A3038;color:#ECEAE4;font-size:14px" class="num">+15 s</button>
      <button style="height:44px;padding:0 18px;border-radius:22px;border:1px solid #2A3038;color:#98A0AE;font-size:14px">Skip</button>
    </div>
    <div role="timer" aria-label="Rest, 47 seconds of 1 minute 30" style="position:relative;height:60px;border-radius:30px;background:#1D2128;border:1px solid #2A3038;overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:0 22px">
      <div aria-hidden="true" style="position:absolute;inset:0;width:52%;background:#2B3A2F;border-radius:30px 0 0 30px"></div>
      <span class="lbl" style="position:relative">Rest</span>
      <span class="num" style="position:relative;font-size:30px;font-weight:600;letter-spacing:-.02em">0:47</span>
      <span class="num" style="position:relative;font-size:14px;color:#98A0AE">/ 1:30</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:#6A7280"><span>Turns red and counts up past 1:30</span><span>Vibrates at 0</span></div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
