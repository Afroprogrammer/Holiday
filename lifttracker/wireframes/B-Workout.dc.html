<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Focus · Push A workout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
body{margin:0;background:#14120F;color:#F3EFE6;font-family:"Barlow",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#6FD3B0}a:hover{color:#8FE3C6}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.big{font-family:"Barlow Condensed","Barlow",sans-serif;font-variant-numeric:tabular-nums}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#9A938A}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#14120F;display:flex;flex-direction:column;overflow:hidden;padding:24px 20px 24px">

  <header style="display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <span class="lbl">Push A · 2 of 5</span>
      <button style="height:36px;padding:0 12px;border-radius:8px;color:#9A938A;font-size:14px">Finish</button>
    </div>
    <ol aria-label="Exercises" style="list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px">
      <li style="height:6px;border-radius:3px;background:#6FD3B0"></li>
      <li style="height:6px;border-radius:3px;background:#6FD3B0;opacity:.55"></li>
      <li style="height:6px;border-radius:3px;background:#3A352E"></li>
      <li style="height:6px;border-radius:3px;background:#3A352E"></li>
      <li style="height:6px;border-radius:3px;background:#3A352E"></li>
    </ol>
  </header>

  <section style="margin-top:26px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
    <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
      <h1 class="big" style="margin:0;font-size:38px;line-height:.95;font-weight:600;letter-spacing:-.01em">Barbell bench press</h1>
      <div class="big" style="font-size:16px;color:#9A938A;font-weight:500">4 × 5–8 · kg · rest 1:30</div>
    </div>
    <button aria-label="Next exercise" style="width:44px;height:44px;border-radius:22px;border:1px solid #3A352E;display:flex;align-items:center;justify-content:center;flex:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A938A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  </section>

  <section style="margin-top:22px;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;justify-content:space-between;min-height:40px;border-bottom:1px solid #2A2621">
      <span style="display:flex;gap:12px;align-items:baseline"><span class="lbl" style="width:40px">Set 1</span><span class="big" style="font-size:20px;font-weight:600">62.5 <span style="font-size:14px;color:#9A938A;font-weight:500">kg</span> × 8</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6FD3B0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-label="done"><path d="M5 12l5 5L20 7"/></svg>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;min-height:40px;border-bottom:1px solid #2A2621">
      <span style="display:flex;gap:12px;align-items:baseline"><span class="lbl" style="width:40px">Set 2</span><span class="big" style="font-size:20px;font-weight:600">62.5 <span style="font-size:14px;color:#9A938A;font-weight:500">kg</span> × 7</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6FD3B0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-label="done"><path d="M5 12l5 5L20 7"/></svg>
    </div>
  </section>

  <section style="margin-top:18px;display:flex;flex-direction:column;gap:4px">
    <div class="lbl">Set 3 of 4</div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
      <button aria-label="Minus 2.5 kg" style="width:60px;height:60px;border-radius:30px;border:1px solid #3A352E;font-size:28px;color:#F3EFE6">−</button>
      <div style="display:flex;flex-direction:column;align-items:center;gap:0;min-width:0">
        <div class="big" style="font-size:112px;line-height:.9;font-weight:700;letter-spacing:-.03em">62.5</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:6px"><span class="big" style="font-size:18px;color:#9A938A">kg</span><span aria-hidden="true" style="width:1px;height:14px;background:#3A352E"></span><span class="big" style="font-size:16px;color:#6FD3B0;font-weight:600">last 60 × 6</span></div>
      </div>
      <button aria-label="Plus 2.5 kg" style="width:60px;height:60px;border-radius:30px;border:1px solid #3A352E;font-size:28px;color:#F3EFE6">+</button>
    </div>

    <div style="margin-top:22px;display:flex;align-items:center;justify-content:center;gap:18px">
      <button aria-label="One rep fewer" style="width:48px;height:48px;border-radius:24px;border:1px solid #3A352E;font-size:22px">−</button>
      <div style="display:flex;align-items:baseline;gap:8px"><span class="big" style="font-size:56px;line-height:1;font-weight:600">6</span><span class="lbl">reps · aim 5–8</span></div>
      <button aria-label="One rep more" style="width:48px;height:48px;border-radius:24px;border:1px solid #3A352E;font-size:22px">+</button>
    </div>
  </section>

  <div style="flex:1"></div>

  <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#9A938A;padding:0 2px 10px"><span>Set 4 next · last 57.5 × 8</span><button style="height:32px;padding:0 8px;color:#9A938A">Knee flag</button></div>
  <button style="height:68px;border-radius:16px;background:#6FD3B0;color:#14120F;display:flex;align-items:center;justify-content:center;gap:12px">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#14120F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>
    <span class="big" style="font-size:24px;font-weight:600;letter-spacing:.02em">Done · rest 1:30</span>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
