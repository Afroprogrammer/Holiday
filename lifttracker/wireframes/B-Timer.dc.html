<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Focus · Rest timer running</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
body{margin:0;background:#14120F;color:#F3EFE6;font-family:"Barlow",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#6FD3B0}a:hover{color:#8FE3C6}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.big{font-family:"Barlow Condensed","Barlow",sans-serif;font-variant-numeric:tabular-nums}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#9A938A}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#14120F;display:flex;flex-direction:column;overflow:hidden">

  <div style="padding:24px 20px 0;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <span class="lbl">Push A · 2 of 5</span>
      <button style="height:36px;padding:0 12px;border-radius:8px;color:#9A938A;font-size:14px">Finish</button>
    </div>
    <ol aria-label="Exercises" style="list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px">
      <li style="height:6px;border-radius:3px;background:#6FD3B0"></li>
      <li style="height:6px;border-radius:3px;background:#6FD3B0;opacity:.55"></li>
      <li style="height:6px;border-radius:3px;background:#3A352E"></li>
      <li style="height:6px;border-radius:3px;background:#3A352E"></li>
      <li style="height:6px;border-radius:3px;background:#3A352E"></li>
    </ol>
  </div>

  <section style="padding:26px 20px 0;display:flex;flex-direction:column;gap:6px">
    <h1 class="big" style="margin:0;font-size:38px;line-height:.95;font-weight:600;letter-spacing:-.01em">Barbell bench press</h1>
    <div class="big" style="font-size:16px;color:#9A938A;font-weight:500">4 × 5–8 · kg · rest 1:30</div>
  </section>

  <section style="padding:18px 20px 0;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;justify-content:space-between;min-height:40px;border-bottom:1px solid #2A2621">
      <span style="display:flex;gap:12px;align-items:baseline"><span class="lbl" style="width:40px">Set 1</span><span class="big" style="font-size:20px;font-weight:600">62.5 <span style="font-size:14px;color:#9A938A;font-weight:500">kg</span> × 8</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6FD3B0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-label="done"><path d="M5 12l5 5L20 7"/></svg>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;min-height:40px;border-bottom:1px solid #2A2621">
      <span style="display:flex;gap:12px;align-items:baseline"><span class="lbl" style="width:40px">Set 2</span><span class="big" style="font-size:20px;font-weight:600">62.5 <span style="font-size:14px;color:#9A938A;font-weight:500">kg</span> × 7</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6FD3B0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-label="done"><path d="M5 12l5 5L20 7"/></svg>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;min-height:40px;border-bottom:1px solid #2A2621">
      <span style="display:flex;gap:12px;align-items:baseline"><span class="lbl" style="width:40px">Set 3</span><span class="big" style="font-size:20px;font-weight:600">62.5 <span style="font-size:14px;color:#9A938A;font-weight:500">kg</span> × 6</span></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6FD3B0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-label="done"><path d="M5 12l5 5L20 7"/></svg>
    </div>
  </section>

  <section style="padding:18px 20px 0;display:flex;flex-direction:column;gap:4px">
    <div class="lbl">Set 4 of 4 · up next</div>
    <div style="display:flex;align-items:baseline;gap:12px"><span class="big" style="font-size:56px;line-height:1;font-weight:700;letter-spacing:-.02em;color:#9A938A">57.5</span><span class="big" style="font-size:16px;color:#9A938A">kg × 8 · last 57.5 × 8</span></div>
  </section>

  <div style="flex:1"></div>

  <section role="timer" aria-label="Rest, 47 seconds of 1 minute 30" style="position:relative;height:300px;background:#1E1B17;border-radius:28px 28px 0 0;padding:0 20px 24px;display:flex;flex-direction:column;overflow:hidden">
    <div aria-hidden="true" style="position:absolute;left:0;top:0;height:4px;width:52%;background:#6FD3B0"></div>
    <div aria-hidden="true" style="position:absolute;left:52%;top:0;height:4px;right:0;background:#3A352E"></div>
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-top:30px">
      <span class="lbl">Rest</span>
      <span class="big" style="font-size:16px;color:#9A938A">target 1:30</span>
    </div>
    <div class="big" style="font-size:140px;line-height:.85;font-weight:700;letter-spacing:-.04em;margin-top:8px">0:47</div>
    <div style="flex:1"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
      <button class="big" style="height:56px;border-radius:14px;border:1px solid #3A352E;font-size:22px;font-weight:600">−15</button>
      <button class="big" style="height:56px;border-radius:14px;border:1px solid #3A352E;font-size:22px;font-weight:600">+15</button>
      <button class="big" style="height:56px;border-radius:14px;background:#2A2621;font-size:20px;font-weight:600;color:#F3EFE6">Skip</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
