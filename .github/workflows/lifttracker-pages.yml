# Builds LiftTracker and publishes it to GitHub Pages on every merge to main.
# The app is served at https://afroprogrammer.github.io/Holiday/ once Pages
# is set to "GitHub Actions" under Settings > Pages in the repository.
name: Publish LiftTracker

on:
  push:
    branches: [main]
    paths:
      - 'lifttracker/**'
      - '.github/workflows/lifttracker-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifttracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lifttracker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /Holiday/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: lifttracker/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
